<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1760" viewBox="0 0 1440 1760" role="img" aria-labelledby="title desc"><title id="title">Claude Code project structure: context, capabilities and controls</title><desc id="desc">Eight connected rows explain project instructions, MCP, settings, rules, skills, legacy commands, agents and hooks. Markdown guidance is distinct from enforced permissions and verification.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#203c4c" stroke-width="1"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#647e8e" stroke-width="1.5"/></marker></defs><rect width="1440" height="1760" fill="#0b1c29"/><rect width="1440" height="1760" fill="url(#grid)" opacity=".38"/><g font-family="DejaVu Sans, sans-serif"><text x="64" y="65" font-size="18" letter-spacing="3" fill="#8de4d1">TECH DIARY  /  AI SOFTWARE ENGINEERING</text><text x="60" y="143" fill="#f4f8fc" font-size="64" font-weight="bold">Claude Code</text><text x="62" y="202" fill="#f4f8fc" font-size="42">A project structure that works</text><text x="64" y="251" fill="#afc2d2" font-size="23">Make context explicit. Load procedures deliberately. Verify every change.</text><line x1="64" y1="284" x2="1376" y2="284" stroke="#345061"/><text x="106" y="326" font-size="17" letter-spacing="2" fill="#afc2d2">WHERE IT LIVES · PROJECT ROOT</text><text x="764" y="326" font-size="17" letter-spacing="2" fill="#afc2d2">WHAT IT DOES</text><rect x="64" y="350" width="1312" height="134" rx="16" fill="#132b3b" stroke="#2d4859"/><rect x="64" y="350" width="5" height="134" rx="2" fill="#8de4d1"/><text x="88" y="381" fill="#8de4d1" font-size="17" font-weight="bold">01</text><text x="132" y="381" fill="#8de4d1" font-size="15" letter-spacing="1.5">PROJECT CONTEXT</text><text x="100" y="422" fill="#f4f8fc" font-family="DejaVu Sans Mono, monospace" font-size="26">CLAUDE.md</text><text x="100" y="458" fill="#afc2d2" font-size="17">CLAUDE.local.md · personal, gitignored</text><path d="M690 416H735" stroke="#647e8e" stroke-width="2" marker-end="url(#arrow)"/><text x="765" y="384" fill="#8de4d1" font-size="24" font-weight="bold">Project knowledge</text><text x="765" y="424" fill="#e5edf5" font-size="19">Architecture, build steps and working agreements.</text><text x="765" y="458" fill="#afc2d2" font-size="18">Keep shared instructions concise and specific.</text><rect x="64" y="498" width="1312" height="134" rx="16" fill="#132b3b" stroke="#2d4859"/><rect x="64" y="498" width="5" height="134" rx="2" fill="#8de4d1"/><text x="88" y="529" fill="#8de4d1" font-size="17" font-weight="bold">02</text><text x="132" y="529" fill="#8de4d1" font-size="15" letter-spacing="1.5">EXTERNAL CONNECTIONS</text><text x="100" y="570" fill="#f4f8fc" font-family="DejaVu Sans Mono, monospace" font-size="26">.mcp.json</text><text x="100" y="606" fill="#afc2d2" font-size="17">Project-scoped server configuration</text><path d="M690 564H735" stroke="#647e8e" stroke-width="2" marker-end="url(#arrow)"/><text x="765" y="532" fill="#8de4d1" font-size="24" font-weight="bold">Tools and services</text><text x="765" y="572" fill="#e5edf5" font-size="19">Connect approved issue trackers, APIs and data tools.</text><text x="765" y="606" fill="#afc2d2" font-size="18">Share configuration; keep credentials outside Git.</text><rect x="64" y="646" width="1312" height="134" rx="16" fill="#132b3b" stroke="#2d4859"/><rect x="64" y="646" width="5" height="134" rx="2" fill="#8de4d1"/><text x="88" y="677" fill="#8de4d1" font-size="17" font-weight="bold">03</text><text x="132" y="677" fill="#8de4d1" font-size="15" letter-spacing="1.5">RUNTIME CONFIGURATION</text><text x="100" y="718" fill="#f4f8fc" font-family="DejaVu Sans Mono, monospace" font-size="26">.claude/settings.json</text><text x="100" y="754" fill="#afc2d2" font-size="17">settings.local.json · local overrides</text><path d="M690 712H735" stroke="#647e8e" stroke-width="2" marker-end="url(#arrow)"/><text x="765" y="680" fill="#8de4d1" font-size="24" font-weight="bold">Permissions and behavior</text><text x="765" y="720" fill="#e5edf5" font-size="19">Configure tool access, model preferences and hooks.</text><text x="765" y="754" fill="#afc2d2" font-size="18">Managed organization settings can constrain these.</text><rect x="64" y="794" width="1312" height="134" rx="16" fill="#132b3b" stroke="#2d4859"/><rect x="64" y="794" width="5" height="134" rx="2" fill="#b5a4f5"/><text x="88" y="825" fill="#b5a4f5" font-size="17" font-weight="bold">04</text><text x="132" y="825" fill="#b5a4f5" font-size="15" letter-spacing="1.5">MODULAR GUIDANCE</text><text x="100" y="866" fill="#f4f8fc" font-family="DejaVu Sans Mono, monospace" font-size="26">.claude/rules/</text><text x="100" y="902" fill="#afc2d2" font-size="17">code-style.md · testing.md · api-conventions.md</text><path d="M690 860H735" stroke="#647e8e" stroke-width="2" marker-end="url(#arrow)"/><text x="765" y="828" fill="#b5a4f5" font-size="24" font-weight="bold">Instructions by topic</text><text x="765" y="868" fill="#e5edf5" font-size="19">Use paths frontmatter for file-specific guidance.</text><text x="765" y="902" fill="#afc2d2" font-size="18">Rules guide the model; they are not access controls.</text><rect x="64" y="942" width="1312" height="134" rx="16" fill="#132b3b" stroke="#2d4859"/><rect x="64" y="942" width="5" height="134" rx="2" fill="#b5a4f5"/><text x="88" y="973" fill="#b5a4f5" font-size="17" font-weight="bold">05</text><text x="132" y="973" fill="#b5a4f5" font-size="15" letter-spacing="1.5">REUSABLE WORKFLOWS</text><text x="100" y="1014" fill="#f4f8fc" font-family="DejaVu Sans Mono, monospace" font-size="26">.claude/skills/</text><text x="100" y="1050" fill="#afc2d2" font-size="17">review/SKILL.md · supporting reference files</text><path d="M690 1008H735" stroke="#647e8e" stroke-width="2" marker-end="url(#arrow)"/><text x="765" y="976" fill="#b5a4f5" font-size="24" font-weight="bold">Procedures on demand</text><text x="765" y="1016" fill="#e5edf5" font-size="19">Descriptions support discovery; details load on use.</text><text x="765" y="1050" fill="#afc2d2" font-size="18">Use /review explicitly or allow contextual invocation.</text><rect x="64" y="1090" width="1312" height="134" rx="16" fill="#132b3b" stroke="#2d4859"/><rect x="64" y="1090" width="5" height="134" rx="2" fill="#b5a4f5"/><text x="88" y="1121" fill="#b5a4f5" font-size="17" font-weight="bold">06</text><text x="132" y="1121" fill="#b5a4f5" font-size="15" letter-spacing="1.5">LEGACY COMMAND FORMAT</text><text x="100" y="1162" fill="#f4f8fc" font-family="DejaVu Sans Mono, monospace" font-size="26">.claude/commands/</text><text x="100" y="1198" fill="#afc2d2" font-size="17">review.md · fix-issue.md</text><path d="M690 1156H735" stroke="#647e8e" stroke-width="2" marker-end="url(#arrow)"/><text x="765" y="1124" fill="#b5a4f5" font-size="24" font-weight="bold">Still supported</text><text x="765" y="1164" fill="#e5edf5" font-size="19">Custom commands now share the skills system.</text><text x="765" y="1198" fill="#afc2d2" font-size="18">Prefer skills for new workflows and supporting files.</text><rect x="64" y="1238" width="1312" height="134" rx="16" fill="#132b3b" stroke="#2d4859"/><rect x="64" y="1238" width="5" height="134" rx="2" fill="#f4cb83"/><text x="88" y="1269" fill="#f4cb83" font-size="17" font-weight="bold">07</text><text x="132" y="1269" fill="#f4cb83" font-size="15" letter-spacing="1.5">FOCUSED DELEGATION</text><text x="100" y="1310" fill="#f4f8fc" font-family="DejaVu Sans Mono, monospace" font-size="26">.claude/agents/</text><text x="100" y="1346" fill="#afc2d2" font-size="17">code-reviewer.md · security-auditor.md</text><path d="M690 1304H735" stroke="#647e8e" stroke-width="2" marker-end="url(#arrow)"/><text x="765" y="1272" fill="#f4cb83" font-size="24" font-weight="bold">Specialist subagents</text><text x="765" y="1312" fill="#e5edf5" font-size="19">Give a focused role its own context and tool scope.</text><text x="765" y="1346" fill="#afc2d2" font-size="18">The main session integrates findings and evidence.</text><rect x="64" y="1386" width="1312" height="134" rx="16" fill="#132b3b" stroke="#2d4859"/><rect x="64" y="1386" width="5" height="134" rx="2" fill="#f4cb83"/><text x="88" y="1417" fill="#f4cb83" font-size="17" font-weight="bold">08</text><text x="132" y="1417" fill="#f4cb83" font-size="15" letter-spacing="1.5">EVENT AUTOMATION</text><text x="100" y="1458" fill="#f4f8fc" font-family="DejaVu Sans Mono, monospace" font-size="26">.claude/hooks/</text><text x="100" y="1494" fill="#afc2d2" font-size="17">validate-bash.sh · an example script location</text><path d="M690 1452H735" stroke="#647e8e" stroke-width="2" marker-end="url(#arrow)"/><text x="765" y="1420" fill="#f4cb83" font-size="24" font-weight="bold">Registered lifecycle checks</text><text x="765" y="1460" fill="#e5edf5" font-size="19">Register handlers in settings; the folder alone is inert.</text><text x="765" y="1494" fill="#afc2d2" font-size="18">PreToolUse can allow, ask or deny a tool action.</text><rect x="64" y="1554" width="1312" height="105" rx="16" fill="#1d3d48" stroke="#427b7b"/><text x="94" y="1594" fill="#8de4d1" font-size="20" font-weight="bold">THE ENGINEERING LOOP</text><text x="94" y="1631" fill="#f4f8fc" font-size="24">Shared context → Focused execution → Tests and review → Verified delivery</text><text x="64" y="1705" fill="#afc2d2" font-size="18">Md. Mizanur Rahman · mmrmilon.github.io/techdiary</text><text x="64" y="1736" fill="#afc2d2" font-size="16">A practical map, not a mandatory folder template. Instructions improve consistency; evidence establishes correctness.</text></g></svg>